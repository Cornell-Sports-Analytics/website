# Optional details for the Past projects page.
#
# A PDF shows up on the page as soon as it is saved in projects/<year>/, even with no entry here.
# Without an entry, its title is made from the file name. Add an entry to give it a proper
# title, the authors, and a one-sentence summary.
#
# The key must match the PDF's file name exactly. Example:
#
# "nba-draft-model.pdf":
#   title: Predicting NBA draft picks from college tracking data
#   authors: Firstname Lastname, Firstname Lastname
#   summary: We compare three models for ranking prospects and test them on ten years of drafts.
