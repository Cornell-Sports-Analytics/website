<header class="site-header">
  <div class="wrap site-header-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}">
      <span class="wordmark-bar" aria-hidden="true"></span>
      <span>Cornell Sports Analytics</span>
    </a>
    <nav aria-label="Main">
      <ul class="nav">
        {%- for item in site.data.navigation %}
        <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {%- endfor %}
      </ul>
    </nav>
  </div>
</header>
